<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Teste de Impressão - Prayer</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/printerTester.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Prayer Printer Tester</h1>
      </div>

      <div class="card">
        <div class="card-header">🖨️ Seleção de Impressora</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Impressora Destino</label>
            <div class="d-flex gap-2">
              <select id="printer" class="form-select flex-grow-1"></select>
              <button id="refresh" class="btn btn-outline-secondary">
                🔄 Atualizar
              </button>
            </div>
            <div id="printerMeta" class="printer-meta"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <ul class="nav nav-tabs" id="tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              data-bs-toggle="tab"
              data-bs-target="#tab-text"
              type="button"
              role="tab">
              📝 Texto RAW
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              data-bs-toggle="tab"
              data-bs-target="#tab-html"
              type="button"
              role="tab">
              🌐 HTML
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="tab-text" role="tabpanel">
            <div class="mb-3">
              <label class="form-label">Conteúdo do Texto (RAW)</label>
              <textarea
                id="text"
                class="form-control"
                rows="10"
                placeholder="Digite aqui o conteúdo que será enviado diretamente para a impressora...">
Teste de impressão RAW - Prayer System
Data: ${new Date().toLocaleString('pt-BR')}
Status: Teste em andamento
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Item 1: Produto A
Item 2: Produto B  
Item 3: Produto C
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Total: R$ 123,45
</textarea
              >
            </div>
            <button id="btnPrintText" class="btn btn-primary">
              🖨️ Imprimir Texto RAW
            </button>
          </div>

          <div class="tab-pane fade" id="tab-html" role="tabpanel">
            <div class="mb-3">
              <label class="form-label">Código HTML</label>
              <textarea
                id="html"
                class="form-control"
                rows="10"
                placeholder="Digite aqui o código HTML que será renderizado e impresso...">
<div style="padding:16px;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;max-width:600px">
  <div style="text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:15px">
    <h2 style="margin:0;color:#2c3e50">🏪 Prayer System</h2>
    <p style="margin:5px 0;color:#7f8c8d;font-size:12px">Teste de Impressão HTML</p>
  </div>
  
  <div style="margin-bottom:15px">
    <strong>Data:</strong> ${new Date().toLocaleString('pt-BR')}<br>
    <strong>Status:</strong> <span style="color:#27ae60">✅ Ativo</span>
  </div>
  
  <table style="width:100%;border-collapse:collapse;margin-bottom:15px">
    <tr style="background:#f8f9fa">
      <th style="border:1px solid #ddd;padding:8px;text-align:left">Item</th>
      <th style="border:1px solid #ddd;padding:8px;text-align:right">Valor</th>
    </tr>
    <tr>
      <td style="border:1px solid #ddd;padding:8px">Produto A</td>
      <td style="border:1px solid #ddd;padding:8px;text-align:right">R$ 45,00</td>
    </tr>
    <tr>
      <td style="border:1px solid #ddd;padding:8px">Produto B</td>
      <td style="border:1px solid #ddd;padding:8px;text-align:right">R$ 78,45</td>
    </tr>
    <tr style="background:#f8f9fa;font-weight:bold">
      <td style="border:1px solid #ddd;padding:8px">Total</td>
      <td style="border:1px solid #ddd;padding:8px;text-align:right">R$ 123,45</td>
    </tr>
  </table>
  
  <div style="text-align:center;color:#7f8c8d;font-size:11px;margin-top:20px">
    Gerado pelo Prayer System • ${new Date().toLocaleString('pt-BR')}
  </div>
</div></textarea
              >
            </div>
            <button id="btnPrintHtml" class="btn btn-success">
              🌐 Imprimir HTML
            </button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">📋 Resultado da Impressão</div>
        <div class="card-body">
          <div class="result" id="result"></div>
        </div>
      </div>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/printerTester.js"></script>
  </body>
</html>
